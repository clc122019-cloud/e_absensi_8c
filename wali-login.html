<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Login Wali Kelas | e-ABSENSI 8C</title>
<style>
*{box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#020617,#0b2b5c);padding:20px}
.card{width:min(420px,100%);background:#fff;border-radius:25px;padding:35px;box-shadow:0 25px 70px #0005}
.logo{width:85px;height:85px;margin:auto}
.logo img{width:100%;height:100%;object-fit:contain}
h1{text-align:center;font-size:25px;color:#0f172a;margin:16px 0 6px}
.sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:25px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 7px}
input{width:100%;height:49px;border:1px solid #cbd5e1;border-radius:12px;padding:0 13px;font-size:14px;outline:none}
input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}
button{width:100%;height:50px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700;margin-top:20px;cursor:pointer;transition:.2s}
button:hover{background:#1d4ed8;transform:translateY(-1px)}
.hint{margin-top:14px;background:#f8fafc;padding:10px;border-radius:10px;text-align:center;font-size:11px;color:#64748b}
.back{text-align:center;margin-top:18px;font-size:13px}
.back a{color:#2563eb;text-decoration:none}
.back a:hover{text-decoration:underline}
.error{display:none;margin-top:12px;background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;padding:10px;border-radius:10px;font-size:11px;text-align:center}
</style>
</head>

<body>
<div class="card">
  <div class="logo">
    <img src="assets/logo-smpn5.png" alt="Logo SMP Negeri 5 Cilegon">
  </div>

  <h1>Wali Kelas VIII-C</h1>
  <div class="sub">Masuk untuk mengelola kehadiran siswa</div>

  <form onsubmit="login(event)">
    <label for="u">Username</label>
    <input id="u" required autocomplete="username" placeholder="Masukkan username">

    <label for="p">Password</label>
    <input id="p" type="password" required autocomplete="current-password" placeholder="Masukkan password">

    <button type="submit">MASUK KE DASHBOARD</button>
  </form>

  <div class="error" id="error">Username atau password belum diisi dengan benar.</div>

  <div class="hint">
    Akses Wali Kelas VIII-C · Tahun Pelajaran 2026/2027
  </div>

  <div class="back">
    <a href="index.html">← Kembali ke halaman utama</a>
  </div>
</div>

<script>
function login(e){
  e.preventDefault();

  const username=document.getElementById("u").value.trim();
  const password=document.getElementById("p").value.trim();
  const error=document.getElementById("error");

  error.style.display="none";

  if(!username || !password){
    error.textContent="Username dan password wajib diisi.";
    error.style.display="block";
    return;
  }

  /*
   * Saat ini autentikasi masih bersifat prototype.
   * Setelah tombol MASUK ditekan, pengguna diarahkan
   * ke dashboard Wali Kelas FINAL.
   */
  window.location.href="wali-kelas.html";
}
</script>
</body>
</html>
